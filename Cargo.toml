[package]
name = "lxagents-shared-instruction"
version = "6.0.5"
edition = "2024"
rust-version = "1.88"
description = "Read-only Skill MCP server that delivers the LXAgents shared agent instruction set, one tool per file in content/."
license = "MIT"
authors = ["LXAgents"]
repository = "https://github.com/LXAgents-Skills/shared-instruction"
homepage = "https://github.com/LXAgents-Skills/shared-instruction#readme"
keywords = ["mcp", "model-context-protocol", "agents", "agent-instructions", "lxagents"]
publish = false
default-run = "lxagents-shared-instruction"

# The stdio server, which also reaches HTTP on MCP_TRANSPORT=http. Replaces dist/index.js.
[[bin]]
name = "lxagents-shared-instruction"
path = "src/main.rs"

# The HTTP server. Replaces dist/http.js.
[[bin]]
name = "lxagents-shared-instruction-http"
path = "src/bin/lxagents-shared-instruction-http.rs"

[dependencies]
axum = "0.8.9"
rmcp = { version = "3.10.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde_json = "1.0.154"
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-std", "signal", "time", "sync"] }
tokio-util = "0.7"

[profile.release]
strip = true
